services:
  ufo-board:
    build: .
    container_name: ufo-board
    ports:
      - "8080:80"        # change the left number if 8080 is taken on your NAS
    restart: unless-stopped

  # One-off job: download YouTube transcripts into data/youtube/ (run from a home connection).
  #   docker compose run --rm transcripts
  transcripts:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -q yt-dlp youtube-transcript-api && python3 pipeline/fetch_youtube.py"
