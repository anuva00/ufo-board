services:
  ufo-board:
    build: .
    container_name: ufo-board
    ports:
      - "8080:8080"        # change the left number if 8080 is taken on your NAS
    volumes:
      - ./nas-data:/data   # subscriptions and transcripts live here, outside the container
    environment:
      CHECK_HOURS: "6"     # how often to look for new videos
      PAUSE_SECONDS: "8"   # wait between caption downloads
      OCR_WORKERS: "3"     # scanned pages read at once; the DXP4800 Pro can take 3 or 4
      KEEP_IMAGES: "1"     # keep page scans after reading (about 90 GB for all of Blue Book); 0 deletes them
    restart: unless-stopped
